name: CI

on:
  push:
    branches:
      - '*-main'
      - '*-ci'
      - '*-rc'
    paths-ignore:
      - README*
      - .github/workflows/*
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch override (leave empty to use the "Use workflow from" branch)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      target_branch: ${{ steps.vars.outputs.target_branch }}
      dt:            ${{ steps.vars.outputs.dt }}
      kernelver:     ${{ steps.vars.outputs.kernelver }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}
          fetch-depth: 10

      - name: Compute shared variables
        id: vars
        run: |
          echo "target_branch=${{ github.event.inputs.target_branch || github.ref_name }}" >> $GITHUB_OUTPUT
          echo "dt=$(date +'%Y-%m-%d_%H%M')"                                               >> $GITHUB_OUTPUT
          echo "kernelver=$(make kernelversion)"                                           >> $GITHUB_OUTPUT

      - name: Generate Changelog
        run: |
          TARGET_BRANCH=${{ github.event.inputs.target_branch || github.ref_name }}
          KERNELVER=$(make kernelversion)
          echo "# CI-Build for $TARGET_BRANCH ($KERNELVER)" > CHANGELOG.txt
          echo "Last commits:"                              >> CHANGELOG.txt
          git log --pretty=format:"%h %ad %s %d by %an" --date=short >> CHANGELOG.txt

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.txt
          retention-days: 1

  build:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [bpi-r4, bpi-r3, bpi-r2pro, bpi-r64, bpi-r2]

    env:
      TARGET_BOARD:  ${{ matrix.board }}
      TARGET_BRANCH: ${{ needs.setup.outputs.target_branch }}
      KERNELVER:     ${{ needs.setup.outputs.kernelver }}
      DT:            ${{ needs.setup.outputs.dt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 10

      - name: Setup environment
        run: |
          echo "UBUNTU_MAJOR_VERSION=$(cat /etc/issue | head -1 | sed -e 's/^Ubuntu \([0-9]\+\).*$/\1/')" >> $GITHUB_ENV
          echo "ARTIFACT_DIR=${{ github.workspace }}/release-artifacts" >> $GITHUB_ENV

      - name: Print environment variables
        run: |
          echo "Branch Target:   $TARGET_BRANCH"
          echo "Kernel Version:  $KERNELVER"
          echo "Date/Time:       $DT"
          echo "Ubuntu Version:  $UBUNTU_MAJOR_VERSION"
          echo "Board Target:    $TARGET_BOARD"

      - name: Update apt-repos (Ubuntu 22)
        if: env.UBUNTU_MAJOR_VERSION == '22'
        run: |
          cat /etc/apt/sources.list
          sudo sed -i.bak -e 's/^deb/deb [ arch=amd64,i386 ]/' /etc/apt/sources.list
          echo "deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports jammy main universe" | sudo tee -a /etc/apt/sources.list

      - name: Update apt-repos (Ubuntu 24)
        if: env.UBUNTU_MAJOR_VERSION == '24'
        run: |
          sudo sed -i 's/^Suites:/Architectures: amd64 i386\nSuites:/' /etc/apt/sources.list.d/*.sources || true
          
          for f in /etc/apt/sources.list.d/*.list; do
            if [ -f "$f" ]; then
              sudo sed -i 's/^deb \(http\|https\|mirror\)/deb [arch=amd64,i386] \1/' "$f" || true
            fi
          done
          
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          Architectures: armhf arm64
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt install ccache libssl-dev:armhf libssl-dev:arm64 build-essential \
            u-boot-tools python3-mako debhelper fakeroot gcc-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu make device-tree-compiler libncurses5-dev libelf-dev \
            libdw-dev

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache/
          key: ${{ runner.os }}-ccache-${{ env.TARGET_BRANCH }}-${{ matrix.board }}-${{ env.KERNELVER }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.TARGET_BRANCH }}-${{ matrix.board }}

      - name: Prepare build.conf for ${{ matrix.board }}
        run: |
          # Comment out all active boards
          sed -ri 's/^(board=.*)/#\1/' build.conf || true
          # Enforce exact match including line boundaries to avoid partial matching (e.g., matching r2pro when aiming for r2)
          sed -ri "s/^#board=${TARGET_BOARD}([[:space:]]|$)/board=${TARGET_BOARD}\1/" build.conf
          # Verify selection in logs
          echo "Selected board in build.conf:"
          grep "^board=" build.conf

      - name: Build for ${{ matrix.board }}
        run: |
          export PATH=/usr/lib/ccache:$PATH
          bash build.sh importconfig
          bash build.sh build

          if [[ "$TARGET_BOARD" == "bpi-r2" || "$TARGET_BOARD" == "bpi-r64" ]]; then
            bash build.sh cryptodev
          fi

      - name: Pack for ${{ matrix.board }}
        run: |
          bash build.sh pack_debs
          bash build.sh pack

      - name: Collect artifacts into workspace
        run: |
          mkdir -p "$ARTIFACT_DIR"
          shopt -s nullglob
          
          [ -d "../SD" ] && cp -r ../SD/* "$ARTIFACT_DIR/" || true
          cp ../*.deb "$ARTIFACT_DIR/" || true
          cp *.itb "$ARTIFACT_DIR/" || true
            
          echo "Collected files for ${TARGET_BOARD}:"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload build artifacts for ${{ matrix.board }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.board }}
          retention-days: 1
          path: release-artifacts/

  release:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    if: endsWith(needs.setup.outputs.target_branch, '-main')

    env:
      TARGET_BRANCH: ${{ needs.setup.outputs.target_branch }}
      KERNELVER:     ${{ needs.setup.outputs.kernelver }}
      DT:            ${{ needs.setup.outputs.dt }}

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          
          find all-artifacts/artifacts-* -type f \( \
            -name "*.itb" -o \
            -name "*.tar.gz" -o \
            -name "*.md5" -o \
            -name "*.deb" \
          \) -exec cp --update=none {} release-files/ \;
          
          echo "=== Files for release ==="
          ls -lh release-files/

      - name: Upload all boards to a single release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: all-artifacts/changelog/CHANGELOG.txt
          tag_name: "CI-BUILD-${{ env.TARGET_BRANCH }}-${{ env.KERNELVER }}-${{ env.DT }}"
          target_commitish: ${{ github.sha }}
          files: release-files/*
